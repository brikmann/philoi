<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<style>:root{--surface-1:#241c38;--font-sans:'Inter',system-ui,sans-serif}body{margin:0;background:#0f0d15;min-height:100vh;display:flex;justify-content:center;padding:24px;font-family:var(--font-sans)}</style>
<style>
.pcwrap{background:var(--surface-1);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.phone{width:300px;height:600px;background:#14111c;border-radius:34px;padding:10px;border:1px solid rgba(255,255,255,.08)}
.stage{height:100%;background:#1b1726;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;padding:18px 16px 14px;box-sizing:border-box;color:#FFF6EC}
.top{text-align:center}
.fl{transform-origin:50% 88%;animation:flick 1.9s ease-in-out infinite}
.done{font-family:var(--font-sans);font-weight:500;font-size:19px;margin-top:2px}
.goal{display:inline-flex;align-items:center;gap:6px;background:#3a2a22;color:#FFD27A;font-size:12px;font-weight:500;padding:4px 11px;border-radius:999px;margin-top:12px}
.dur{font-family:var(--font-sans);font-weight:500;font-size:38px;letter-spacing:1px;margin-top:4px;text-align:center}
.durl{text-align:center;font-size:11px;color:#7c7194;letter-spacing:1px;margin-top:-2px}
.xprow{display:flex;align-items:center;gap:12px;margin-top:18px;background:#241c38;border-radius:14px;padding:12px}
.hex{width:44px;height:47px;clip-path:polygon(50% 2%,95% 26%,95% 74%,50% 98%,5% 74%,5% 26%);background:#9A6A12;display:flex;align-items:center;justify-content:center;flex:none}
.hexin{width:37px;height:40px;clip-path:polygon(50% 2%,95% 26%,95% 74%,50% 98%,5% 74%,5% 26%);background:#F5C542;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px;color:#4A3406;font-family:var(--font-sans)}
.xpcol{flex:1;min-width:0}
.xptop{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:#a99cbd}
.xptop .plus{color:#FFD27A;font-weight:500;opacity:0;transition:opacity .4s .3s}
.xptop .plus.on{opacity:1}
.xptop b{color:#FFF6EC;font-weight:500}
.trk{height:8px;background:#2d2740;border-radius:999px;overflow:hidden;margin-top:7px}
.trk i{display:block;height:100%;width:54%;background:#E0612C;border-radius:999px;transition:width 1.1s cubic-bezier(.2,.7,.3,1)}
.streak{display:flex;align-items:center;gap:9px;background:#241c38;border-radius:12px;padding:11px 12px;margin-top:10px}
.streak .ic{color:#F2A33C;font-size:19px}
.streak .m{flex:1;font-size:13px;font-weight:500}
.streak .s{font-size:11px;color:#a99cbd}
.phlbl{font-size:11px;color:#7c7194;margin:14px 0 7px}
.phrow{display:flex;gap:6px}
.ph{width:50px;height:50px;border-radius:9px;display:flex;align-items:flex-end;justify-content:flex-end;padding:4px;color:rgba(255,255,255,.8);font-size:10px}
.cta{width:100%;border:0;border-radius:14px;padding:14px;margin-top:auto;background:#E0612C;color:#fff;font-family:var(--font-sans);font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.priv{text-align:center;font-size:12.5px;color:#7c7194;margin-top:10px;cursor:pointer}
@keyframes flick{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.05) scaleX(.97)}}
</style>
<div class="pcwrap">
  <div class="phone"><div class="stage">
    <div class="top">
      <svg width="46" height="52" viewBox="0 0 120 150" aria-hidden="true"><g class="fl"><path d="M60 20 C74 46 90 62 85 92 C82 108 72 116 60 116 C48 116 37 107 37 92 C37 82 42 76 47 72 C44 84 51 92 59 92 C68 92 72 82 67 72 C60 58 52 44 60 20 Z" fill="#E0612C"/><path d="M60 44 C70 62 78 74 74 92 C72 104 67 110 60 110 C52 110 47 103 47 93 C47 86 50 82 54 80 C52 88 56 94 61 94 C67 94 70 87 67 80 C62 70 56 58 60 44 Z" fill="#F2A33C"/><path d="M60 66 C66 78 70 84 68 94 C67 101 64 105 60 105 C55 105 52 100 52 94 C52 88 55 84 60 66 Z" fill="#FFD27A"/></g></svg>
      <div class="done">Nice work</div>
    </div>
    <div style="text-align:center"><span class="goal"><i class="ti ti-barbell" aria-hidden="true"></i>Gym · leg day</span></div>
    <div class="dur">48:12</div>
    <div class="durl">LOCKED IN</div>
    <div class="xprow">
      <div class="hex"><div class="hexin">I</div></div>
      <div class="xpcol">
        <div class="xptop"><span>Gold I</span><span><span class="plus" id="plus">+96 XP</span> &nbsp;<b id="num">1,340</b> / 2,500</span></div>
        <div class="trk"><i id="fill"></i></div>
      </div>
    </div>
    <div class="streak"><i class="ti ti-flame ic" aria-hidden="true"></i><div class="m">6-day streak</div><div class="s">kept alive</div></div>
    <div class="phlbl">From this session</div>
    <div class="phrow"><div class="ph" style="background:#4a5a2b">48m</div><div class="ph" style="background:#3a4a5a"></div></div>
    <button class="cta"><i class="ti ti-send" aria-hidden="true"></i>Post to the campfire</button>
    <div class="priv">Keep this one private</div>
  </div></div>
</div>
<script>
(function(){
  var fill=document.getElementById('fill'),num=document.getElementById('num'),plus=document.getElementById('plus');
  var start=1340,end=1436,max=2500;
  setTimeout(function(){
    fill.style.width=(end/max*100).toFixed(1)+'%';
    plus.classList.add('on');
    var t0=null,dur=1100;
    function step(ts){if(!t0)t0=ts;var p=Math.min((ts-t0)/dur,1);var v=Math.round(start+(end-start)*p);num.textContent=v.toLocaleString();if(p<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  },250);
})();
</script>
