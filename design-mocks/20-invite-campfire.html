<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<style>:root{--font-sans:'Inter',system-ui,sans-serif}body{margin:0;background:#0f0d15;min-height:100vh;display:flex;justify-content:center;padding:24px;font-family:var(--font-sans)}</style>
<style>
.pcwrap{background:#241c38;border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.phone{width:300px;height:600px;background:#14111c;border-radius:34px;padding:10px;border:1px solid rgba(255,255,255,.08)}
.stage{height:100%;background:#1b1726;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;padding:16px 15px 14px;box-sizing:border-box;color:#FFF6EC}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hd i{color:#a99cbd;font-size:20px}
.hd .t{font-family:var(--font-sans);font-weight:500;font-size:17px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:14px}
.fl{width:58px;height:58px;border-radius:16px;background:#3a2a22;display:flex;align-items:center;justify-content:center;color:#F2A33C;font-size:30px}
.hero .nm{font-size:17px;font-weight:500;margin-top:10px}
.hero .sub{font-size:12px;color:#a99cbd;margin-top:3px;line-height:1.4;padding:0 8px}
.clbl{font-size:11px;color:#7c7194;letter-spacing:1px;margin:22px 0 7px;text-transform:uppercase}
.code{background:#241c38;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:15px 16px;display:flex;align-items:center;gap:10px}
.code .val{flex:1;font-family:var(--font-sans);font-weight:600;font-size:24px;letter-spacing:5px;color:#FFF6EC}
.code .cp{width:36px;height:36px;border-radius:10px;background:#2d2740;display:flex;align-items:center;justify-content:center;color:#FFD27A;font-size:18px;flex:none;cursor:pointer}
.linkrow{display:flex;align-items:center;gap:9px;background:#20182f;border-radius:12px;padding:11px 12px;margin-top:9px}
.linkrow .lk{font-size:12.5px;color:#cbbfe0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow .cp2{color:#FFD27A;font-size:16px;cursor:pointer}
.spring{flex:1}
.share{width:100%;border:0;border-radius:14px;padding:15px;background:#E0612C;color:#fff;font-family:var(--font-sans);font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer}
.qr{text-align:center;font-size:12.5px;color:#a99cbd;margin-top:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
</style>
<div class="pcwrap">
  <div class="phone"><div class="stage">
    <div class="hd"><i class="ti ti-chevron-left" aria-hidden="true"></i><div class="t">Invite to your campfire</div></div>
    <div class="hero">
      <div class="fl"><i class="ti ti-flame" aria-hidden="true"></i></div>
      <div class="nm">Yo</div>
      <div class="sub">Anyone with this code can join and lock in with you.</div>
    </div>
    <div class="clbl">Campfire code</div>
    <div class="code"><span class="val">871F91</span><span class="cp"><i class="ti ti-copy" aria-hidden="true"></i></span></div>
    <div class="linkrow"><span class="lk">philoi.app/join/871F91</span><i class="ti ti-copy cp2" aria-hidden="true"></i></div>
    <div class="spring"></div>
    <button class="share"><i class="ti ti-share-2" aria-hidden="true"></i>Share invite link</button>
    <div class="qr"><i class="ti ti-qrcode" aria-hidden="true"></i>Show QR code</div>
  </div></div>
</div>
