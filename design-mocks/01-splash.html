<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<style>:root{--surface-1:#241c38;--surface-2:#2d2740;--border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.2);--text-primary:#FFF6EC;--text-secondary:#a99cbd;--text-muted:#7c7194;--font-sans:'Inter',system-ui,sans-serif;--radius:12px}body{margin:0;background:#0f0d15;min-height:100vh;display:flex;justify-content:center;padding:24px;font-family:var(--font-sans)}</style>
<style>
.pcwrap{background:var(--surface-1);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.phone{width:300px;height:600px;background:#14111c;border-radius:34px;padding:10px;border:1px solid rgba(255,255,255,.08)}
.stage{position:relative;height:100%;background:#1b1726;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 22px;box-sizing:border-box;color:#FFF6EC}
.logo{position:relative;width:132px;height:150px;display:flex;align-items:flex-end;justify-content:center}
.fl{transform-origin:50% 90%;animation:flick 1.8s ease-in-out infinite}
.ember{position:absolute;left:50%;bottom:50px;width:5px;height:5px;border-radius:999px;background:#F2A33C;opacity:0;animation:emb 3s ease-out infinite}
.name{font-family:var(--font-sans);font-weight:500;font-size:32px;letter-spacing:.5px;margin-top:6px}
.trans{font-size:13px;color:#a99cbd;margin-top:11px;letter-spacing:.3px}
.trans .gk{color:#FFD27A;font-size:16px;letter-spacing:1px}
.def{font-size:13px;color:#cbbfe0;margin-top:10px;text-align:center;font-style:italic;line-height:1.5;max-width:230px}
.spacer{flex:1}
.btn{width:100%;border:0;border-radius:15px;padding:15px;background:#FFF6EC;color:#1b1726;font-family:var(--font-sans);font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.fine{font-size:10.5px;color:#7c7194;text-align:center;margin-top:13px;line-height:1.4}
@keyframes flick{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.06) scaleX(.96)}}
@keyframes emb{0%{opacity:0;transform:translate(-50%,0) scale(1)}15%{opacity:.85}100%{opacity:0;transform:translate(calc(-50% + var(--ex)),-120px) scale(.3)}}
</style>
<div class="pcwrap">
  <div class="phone"><div class="stage">
    <div class="spacer"></div>
    <div class="logo" id="logo">
      <svg width="132" height="150" viewBox="0 0 120 150" aria-hidden="true">
        <rect x="30" y="112" width="60" height="9" rx="4" fill="#8a5a2b" transform="rotate(18 60 116)"/>
        <rect x="30" y="112" width="60" height="9" rx="4" fill="#6e4423" transform="rotate(-18 60 116)"/>
        <circle cx="60" cy="116" r="4" fill="#F2A33C"/>
        <g class="fl">
          <path d="M60 20 C74 46 90 62 85 92 C82 108 72 116 60 116 C48 116 37 107 37 92 C37 82 42 76 47 72 C44 84 51 92 59 92 C68 92 72 82 67 72 C60 58 52 44 60 20 Z" fill="#E0612C"/>
          <path d="M60 44 C70 62 78 74 74 92 C72 104 67 110 60 110 C52 110 47 103 47 93 C47 86 50 82 54 80 C52 88 56 94 61 94 C67 94 70 87 67 80 C62 70 56 58 60 44 Z" fill="#F2A33C"/>
          <path d="M60 66 C66 78 70 84 68 94 C67 101 64 105 60 105 C55 105 52 100 52 94 C52 88 55 84 60 66 Z" fill="#FFD27A"/>
        </g>
      </svg>
    </div>
    <div class="name">Philoi</div>
    <div class="trans"><span class="gk">φίλοι</span> · <i>fee-loy</i> · Ancient Greek</div>
    <div class="def">"close friends bound by trust, affection, and shared effort"</div>
    <div class="spacer"></div>
    <button class="btn"><i class="ti ti-brand-google" aria-hidden="true"></i>Continue with Google</button>
    <div class="fine">By continuing you agree to our Terms &amp; Privacy Policy.</div>
  </div></div>
</div>
<script>
(function(){var l=document.getElementById('logo');for(var i=0;i<6;i++){var e=document.createElement('span');e.className='ember';e.style.setProperty('--ex',((Math.random()-.5)*44).toFixed(0)+'px');e.style.left=(44+Math.random()*12)+'%';e.style.animationDelay=(Math.random()*3).toFixed(2)+'s';l.appendChild(e);}})();
</script>
