<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<style>:root{--surface-1:#241c38;--surface-2:#2d2740;--border:rgba(255,255,255,.1);--text-secondary:#a99cbd;--font-sans:'Inter',system-ui,sans-serif}body{margin:0;background:#0f0d15;min-height:100vh;display:flex;justify-content:center;padding:24px;font-family:var(--font-sans)}</style>
<style>
.pcwrap{background:var(--surface-1);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.phone{width:300px;height:600px;background:#14111c;border-radius:34px;padding:10px;border:1px solid rgba(255,255,255,.08)}
.stage{position:relative;height:100%;background:#1b1726;border-radius:26px;overflow:hidden;color:#FFF6EC}
.flash{position:absolute;inset:0;background:#FFE9C2;opacity:0;pointer-events:none;z-index:6}
.title{position:absolute;top:7%;left:0;right:0;text-align:center;font-family:var(--font-sans);font-weight:500;font-size:23px;opacity:0;z-index:5}
.fire{position:absolute;top:51%;left:50%;transform:translateX(-50%);z-index:2}
.fire .fl{transform-origin:50% 88%;animation:roar 1s ease-in-out infinite}
.smoke{position:absolute;top:58%;left:50%;width:15px;height:15px;border-radius:999px;background:#9a90ad;opacity:0;z-index:3}
.spk{position:absolute;top:37%;left:50%;width:6px;height:6px;border-radius:999px;background:#F2A33C;opacity:0;z-index:4}
.ember{position:absolute;top:56%;left:50%;width:5px;height:5px;border-radius:999px;background:#F2A33C;opacity:0;z-index:3}
.ring{position:absolute;top:37%;left:50%;width:50px;height:50px;border:3px solid #E0612C;border-radius:999px;transform:translate(-50%,-50%);opacity:0;z-index:3}
.hexwrap{position:absolute;top:23%;left:50%;perspective:800px;opacity:0;z-index:5}
.hexfloat{position:relative;display:inline-block}
.aura{position:absolute;top:50%;left:50%;clip-path:polygon(50% 2%,95% 26%,95% 74%,50% 98%,5% 74%,5% 26%);background:#E0612C;opacity:0;z-index:0}
.a1{width:150px;height:162px}.a2{width:180px;height:194px}
.hex{position:relative;z-index:1;width:120px;height:130px;clip-path:polygon(50% 2%,95% 26%,95% 74%,50% 98%,5% 74%,5% 26%);background:#B0431E;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}
.hexin{width:106px;height:115px;clip-path:polygon(50% 2%,95% 26%,95% 74%,50% 98%,5% 74%,5% 26%);background:#F2A33C;display:flex;align-items:center;justify-content:center}
.crest{font-size:32px;color:#4A1B0C;line-height:1}
.tier{position:absolute;bottom:18%;left:0;right:0;text-align:center;font-family:var(--font-sans);font-weight:500;font-size:22px;color:#FFD27A;opacity:0;z-index:5;letter-spacing:.5px}
.meta{position:absolute;bottom:13.5%;left:0;right:0;text-align:center;font-size:13px;color:#a99cbd;opacity:0;z-index:5}
.ctas{position:absolute;bottom:5%;left:0;right:0;display:flex;gap:10px;justify-content:center;opacity:0;z-index:5}
.btn{border:0;border-radius:14px;padding:12px 20px;font-size:14px;font-weight:500;font-family:var(--font-sans);cursor:pointer;color:#fff;background:#E0612C}
.btn.g{background:#2d2740;color:#e7ddf5;display:flex;align-items:center;gap:6px}
.play .flash{animation:flash .8s ease-out 3.7s}
.play .ring{animation:ring 1.2s ease-out 3.85s}.play .ring.r2{animation:ring 1.2s ease-out 4.15s}
.play .smoke{animation:smoke 3s ease-out}
.play .hexwrap{animation:riseup 3.9s cubic-bezier(.25,.55,.25,1) .5s forwards}
.play .hexfloat{animation:float 3.4s ease-in-out 4.6s infinite}
.play .hex{animation:spin 3.9s ease-out .5s}
.play .hexin{animation:molten 2.2s ease-in-out 4.4s infinite}
.play .a1{animation:aura1 2.8s ease-in-out 4.2s infinite}.play .a2{animation:aura2 2.8s ease-in-out 4.35s infinite}
.play .spk{animation:burst 1.2s ease-out 3.85s}
.play .ember{animation:emb 2.8s ease-out infinite}
.play .title{animation:rise .6s ease-out 4.6s forwards}
.play .tier{animation:rise .6s ease-out 4.85s forwards}
.play .meta{animation:rise .6s ease-out 5.1s forwards}
.play .ctas{animation:rise .6s ease-out 5.35s forwards}
.rep{background:var(--surface-2);border:0.5px solid var(--border);color:var(--text-secondary);font-size:13px;font-family:var(--font-sans);padding:8px 16px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
@keyframes flash{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}
@keyframes ring{0%{opacity:.7;width:50px;height:50px}100%{opacity:0;width:250px;height:250px}}
@keyframes smoke{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:.36}100%{opacity:0;transform:translate(calc(-50% + var(--sx)),-150px) scale(2.2)}}
@keyframes riseup{0%{opacity:0;transform:translateX(-50%) translateY(150px) scale(.1)}15%{opacity:.28}55%{opacity:.6}88%{opacity:1;transform:translateX(-50%) translateY(-6px) scale(1.06)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(1080deg)}}
@keyframes molten{0%,100%{background:#F2A33C}50%{background:#F7B85A}}
@keyframes aura1{0%,100%{opacity:.09;transform:translate(-50%,-50%) scale(1)}50%{opacity:.20;transform:translate(-50%,-50%) scale(1.05)}}
@keyframes aura2{0%,100%{opacity:.03;transform:translate(-50%,-50%) scale(1.04)}50%{opacity:.09;transform:translate(-50%,-50%) scale(1.14)}}
@keyframes burst{0%{transform:translate(-50%,-50%) translate(0,0) scale(1);opacity:1}100%{transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(.2);opacity:0}}
@keyframes emb{0%{opacity:0;transform:translate(-50%,0) scale(1)}15%{opacity:.9}100%{opacity:0;transform:translate(calc(-50% + var(--ex)),-150px) scale(.3)}}
@keyframes roar{0%,100%{transform:scaleY(1) scaleX(1)}30%{transform:scaleY(1.13) scaleX(.94)}60%{transform:scaleY(1.06) scaleX(1.02)}}
@keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
</style>
<div class="pcwrap">
  <div class="phone"><div class="stage" id="stage">
    <div class="flash"></div>
    <div class="title">Rank up</div>
    <div class="ring"></div><div class="ring r2"></div>
    <div class="smokes" id="smokes"></div>
    <div class="embers" id="embers"></div>
    <div class="fire" id="fire"></div>
    <div class="sparks" id="sparks"></div>
    <div class="hexwrap"><div class="hexfloat"><div class="aura a1"></div><div class="aura a2"></div><div class="hex"><div class="hexin"><div class="crest"><svg width="30" height="35" viewBox="0 0 120 150" aria-hidden="true"><path d="M60 20 C74 46 90 62 85 92 C82 108 72 116 60 116 C48 116 37 107 37 92 C37 82 42 76 47 72 C44 84 51 92 59 92 C68 92 72 82 67 72 C60 58 52 44 60 20 Z" fill="#B0431E"/><path d="M60 44 C70 62 78 74 74 92 C72 104 67 110 60 110 C52 110 47 103 47 93 C47 86 50 82 54 80 C52 88 56 94 61 94 C67 94 70 87 67 80 C62 70 56 58 60 44 Z" fill="#E0612C"/></svg></div></div></div></div></div>
    <div class="tier">Infernal</div>
    <div class="meta">from Diamond I · forged from a 30-day streak</div>
    <div class="ctas"><button class="btn">Continue</button><button class="btn g"><i class="ti ti-share" aria-hidden="true"></i>Share</button></div>
  </div></div>
  <button class="rep" id="rep"><i class="ti ti-refresh" aria-hidden="true"></i>Replay</button>
</div>
<script>
(function(){
  var stage=document.getElementById('stage'),sparks=document.getElementById('sparks'),embers=document.getElementById('embers'),smokes=document.getElementById('smokes'),fire=document.getElementById('fire');
  fire.innerHTML='<svg width="110" height="150" viewBox="0 0 120 150" aria-hidden="true"><rect x="30" y="112" width="60" height="9" rx="4" fill="#8a5a2b" transform="rotate(18 60 116)"/><rect x="30" y="112" width="60" height="9" rx="4" fill="#6e4423" transform="rotate(-18 60 116)"/><circle cx="60" cy="116" r="4" fill="#F2A33C"/><g class="fl"><path d="M60 20 C74 46 90 62 85 92 C82 108 72 116 60 116 C48 116 37 107 37 92 C37 82 42 76 47 72 C44 84 51 92 59 92 C68 92 72 82 67 72 C60 58 52 44 60 20 Z" fill="#E0612C"/><path d="M60 44 C70 62 78 74 74 92 C72 104 67 110 60 110 C52 110 47 103 47 93 C47 86 50 82 54 80 C52 88 56 94 61 94 C67 94 70 87 67 80 C62 70 56 58 60 44 Z" fill="#F2A33C"/><path d="M60 66 C66 78 70 84 68 94 C67 101 64 105 60 105 C55 105 52 100 52 94 C52 88 55 84 60 66 Z" fill="#FFD27A"/></g></svg>';
  var cols=['#F2A33C','#FFD27A','#E0612C','#FFB347'];
  for(var i=0;i<13;i++){var a=(Math.PI*2*i/13)+Math.random()*0.3;var d=66+Math.random()*55;var s=document.createElement('span');s.className='spk';s.style.setProperty('--tx',(Math.cos(a)*d).toFixed(0)+'px');s.style.setProperty('--ty',(Math.sin(a)*d).toFixed(0)+'px');s.style.background=cols[i%cols.length];s.style.animationDelay=(3.85+Math.random()*0.12).toFixed(2)+'s';sparks.appendChild(s);}
  for(var j=0;j<6;j++){var e=document.createElement('span');e.className='ember';e.style.left=(44+Math.random()*12)+'%';e.style.setProperty('--ex',((Math.random()-.5)*38).toFixed(0)+'px');e.style.animationDelay=(Math.random()*2.8).toFixed(2)+'s';embers.appendChild(e);}
  for(var k=0;k<4;k++){var m=document.createElement('span');m.className='smoke';m.style.left=(46+Math.random()*8)+'%';m.style.setProperty('--sx',((Math.random()-.5)*38).toFixed(0)+'px');m.style.animationDelay=(0.6+Math.random()*1.8).toFixed(2)+'s';smokes.appendChild(m);}
  function play(){stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play');}
  document.getElementById('rep').addEventListener('click',play);play();
})();
</script>
