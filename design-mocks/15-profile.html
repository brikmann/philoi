<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<style>:root{--surface-1:#241c38;--font-sans:'Inter',system-ui,sans-serif}body{margin:0;background:#0f0d15;min-height:100vh;display:flex;justify-content:center;padding:24px;font-family:var(--font-sans)}</style>
<style>
.pcwrap{background:var(--surface-1);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.phone{width:300px;height:600px;background:#14111c;border-radius:34px;padding:10px;border:1px solid rgba(255,255,255,.08)}
.stage{height:100%;background:#1b1726;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;padding:14px 14px 12px;box-sizing:border-box;color:#FFF6EC}
.top{display:flex;justify-content:space-between;align-items:center}
.top i{color:#a99cbd;font-size:20px}
.id{display:flex;align-items:center;gap:12px;margin-top:6px}
.big{width:60px;height:60px;border-radius:999px;background:#3a2a22;display:flex;align-items:center;justify-content:center;font-size:24px;color:#FFD27A;flex:none}
.nm{font-family:var(--font-sans);font-weight:500;font-size:18px}
.hd2{font-size:12px;color:#a99cbd}
.uni{font-size:11.5px;color:#7c7194;display:flex;align-items:center;gap:4px;margin-top:2px}
.rank{display:flex;align-items:center;gap:11px;margin-top:14px;background:#241c38;border-radius:14px;padding:11px 12px}
.hex{width:40px;height:43px;clip-path:polygon(50% 2%,95% 26%,95% 74%,50% 98%,5% 74%,5% 26%);background:#9A6A12;display:flex;align-items:center;justify-content:center;flex:none}
.hexin{width:34px;height:37px;clip-path:polygon(50% 2%,95% 26%,95% 74%,50% 98%,5% 74%,5% 26%);background:#F5C542;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px;color:#4A3406;font-family:var(--font-sans)}
.rk .t{font-size:11px;color:#a99cbd;display:flex;justify-content:space-between;margin-bottom:4px}
.rk .t b{color:#FFF6EC;font-weight:500}
.trk{height:6px;background:#2d2740;border-radius:999px;overflow:hidden}
.trk i{display:block;height:100%;width:54%;background:#E0612C;border-radius:999px}
.stats{display:flex;gap:8px;margin-top:11px}
.stat{flex:1;background:#20182f;border-radius:12px;padding:9px;text-align:center}
.stat b{display:block;font-size:16px;font-weight:500}.stat span{font-size:10px;color:#a99cbd}
.goals{display:flex;gap:7px;margin-top:11px}
.gchip{display:inline-flex;align-items:center;gap:5px;background:#241c38;border-radius:999px;padding:6px 11px;font-size:11.5px;color:#FFD27A}
.gl{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.gl .a{font-size:12px;color:#7c7194}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.ph{aspect-ratio:1;border-radius:9px;position:relative;display:flex;align-items:flex-end;overflow:hidden}
.ph .ov{width:100%;display:flex;align-items:center;justify-content:space-between;padding:4px 5px;font-size:9px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.5))}
</style>
<div class="pcwrap">
  <div class="phone"><div class="stage">
    <div class="top"><i class="ti ti-chevron-down" aria-hidden="true"></i><i class="ti ti-settings" aria-hidden="true"></i></div>
    <div class="id"><div class="big">N</div><div><div class="nm">Noah B</div><div class="hd2">@noahb</div><div class="uni"><i class="ti ti-map-pin" aria-hidden="true"></i>Wilfrid Laurier</div></div></div>
    <div class="rank"><div class="hex"><div class="hexin">I</div></div><div class="rk" style="flex:1"><div class="t"><span>Gold I</span><span><b>1,340</b> / 2,500 XP</span></div><div class="trk"><i></i></div></div></div>
    <div class="stats"><div class="stat"><b>5</b><span>day streak</span></div><div class="stat"><b>47</b><span>lock-ins</span></div><div class="stat"><b>62h</b><span>locked in</span></div></div>
    <div class="goals"><span class="gchip"><i class="ti ti-barbell" aria-hidden="true"></i>Gym</span><span class="gchip"><i class="ti ti-pencil" aria-hidden="true"></i>Study</span></div>
    <div class="gl"><span class="nm" style="font-size:14px">Lock-ins</span><span class="a">47 sessions</span></div>
    <div class="grid">
      <div class="ph" style="background:#4a5a2b"><div class="ov"><span><i class="ti ti-barbell" aria-hidden="true"></i></span><span>48m</span></div></div>
      <div class="ph" style="background:#3a4a5a"><div class="ov"><span><i class="ti ti-pencil" aria-hidden="true"></i></span><span>1h20</span></div></div>
      <div class="ph" style="background:#5a3a2b"><div class="ov"><span><i class="ti ti-run" aria-hidden="true"></i></span><span>32m</span></div></div>
      <div class="ph" style="background:#4a3a5a"><div class="ov"><span><i class="ti ti-barbell" aria-hidden="true"></i></span><span>55m</span></div></div>
      <div class="ph" style="background:#2b4a44"><div class="ov"><span><i class="ti ti-pencil" aria-hidden="true"></i></span><span>2h05</span></div></div>
      <div class="ph" style="background:#5a4a2b"><div class="ov"><span><i class="ti ti-barbell" aria-hidden="true"></i></span><span>40m</span></div></div>
    </div>
  </div></div>
</div>
