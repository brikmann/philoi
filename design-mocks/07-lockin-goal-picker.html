<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<style>:root{--surface-1:#241c38;--font-sans:'Inter',system-ui,sans-serif}body{margin:0;background:#0f0d15;min-height:100vh;display:flex;justify-content:center;padding:24px;font-family:var(--font-sans)}</style>
<style>
.pcwrap{background:var(--surface-1);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.phone{width:300px;height:600px;background:#14111c;border-radius:34px;padding:10px;border:1px solid rgba(255,255,255,.08)}
.stage{position:relative;height:100%;background:#1b1726;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;color:#FFF6EC}
.dim{flex:1;background:#120f1a;opacity:.55;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:9px;padding:13px;opacity:.8}
.hd .fl{width:24px;height:24px;border-radius:7px;background:#3a2a22;display:flex;align-items:center;justify-content:center;color:#F2A33C;font-size:14px}
.sheet{background:#241c38;border-radius:20px 20px 26px 26px;padding:8px 15px 16px;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.grab{width:36px;height:4px;border-radius:999px;background:#4a4460;margin:4px auto 12px}
.h{font-family:var(--font-sans);font-weight:500;font-size:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal{background:#1b1726;border:1.5px solid transparent;border-radius:12px;padding:10px;display:flex;align-items:center;gap:9px;cursor:pointer}
.goal.on{border-color:#E0612C;background:#2b2036}
.goal .ic{width:30px;height:30px;border-radius:8px;background:#3a2a22;display:flex;align-items:center;justify-content:center;color:#F2A33C;font-size:16px;flex:none}
.goal .lb{font-size:13px;font-weight:500}
.goal.on .lb{color:#FFD27A}
.det{margin-top:11px;background:#1b1726;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:11px 12px;font-size:12.5px;color:#7c7194;display:flex;align-items:center;gap:8px}
.mode{display:flex;gap:8px;margin-top:11px}
.pill{flex:1;text-align:center;background:#1b1726;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px;font-size:12.5px;color:#a99cbd;cursor:pointer}
.pill.on{border-color:#E0612C;color:#FFD27A;background:#2b2036}
.pill .s{display:block;font-size:10.5px;color:#7c7194;margin-top:2px}
.pill.on .s{color:#e7c9b8}
.start{width:100%;border:0;border-radius:14px;padding:14px;margin-top:14px;background:#E0612C;color:#fff;font-family:var(--font-sans);font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
</style>
<div class="pcwrap">
  <div class="phone"><div class="stage">
    <div class="dim"><div class="hd"><div class="fl"><i class="ti ti-flame" aria-hidden="true"></i></div><div style="font-size:14px;font-weight:500">Push day collective</div></div></div>
    <div class="sheet">
      <div class="grab"></div>
      <div class="h">What are you locking in for?</div>
      <div class="grid">
        <div class="goal on"><div class="ic"><i class="ti ti-barbell" aria-hidden="true"></i></div><div class="lb">Gym</div></div>
        <div class="goal"><div class="ic"><i class="ti ti-pencil" aria-hidden="true"></i></div><div class="lb">Study</div></div>
        <div class="goal"><div class="ic"><i class="ti ti-run" aria-hidden="true"></i></div><div class="lb">Run</div></div>
        <div class="goal"><div class="ic"><i class="ti ti-file-text" aria-hidden="true"></i></div><div class="lb">Job apps</div></div>
        <div class="goal"><div class="ic"><i class="ti ti-book" aria-hidden="true"></i></div><div class="lb">Read</div></div>
        <div class="goal"><div class="ic"><i class="ti ti-plus" aria-hidden="true"></i></div><div class="lb">Custom</div></div>
      </div>
      <div class="det"><i class="ti ti-tag" aria-hidden="true"></i>Add a detail — "leg day", "CS midterm"…</div>
      <div class="mode">
        <div class="pill on">With the campfire<span class="s">3 already locked in — join them</span></div>
        <div class="pill">Solo<span class="s">just you</span></div>
      </div>
      <button class="start"><i class="ti ti-lock" aria-hidden="true"></i>Start lock-in</button>
    </div>
  </div></div>
</div>
