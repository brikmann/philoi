<!DOCTYPE html>
<!--
  philoi.app — the "campus hub" landing (2026-11). One screen, no scroll.
  The email field calls the Supabase RPC public.join_waitlist (migration 0300).
  The key below is the public anon key (the same one shipped in the app); it can
  only execute join_waitlist — it has no privileges on the waitlist table.
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Philoi — Your campus hub</title>
<meta name="description" content="The future home for students and clubs to connect, chat, and know what's going on around campus."/>
<link rel="canonical" href="https://philoi.app/"/>
<meta name="theme-color" content="#0E0A1C"/>
<meta name="color-scheme" content="dark"/>

<meta property="og:type" content="website"/>
<meta property="og:site_name" content="philoi"/>
<meta property="og:url" content="https://philoi.app/"/>
<meta property="og:title" content="Philoi — Your campus hub"/>
<meta property="og:description" content="The future home for students and clubs to connect, chat, and know what's going on around campus."/>
<meta property="og:image" content="https://philoi.app/og.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:image:alt" content="philoi — find your people on campus."/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="Philoi — Your campus hub"/>
<meta name="twitter:description" content="The future home for students and clubs to connect, chat, and know what's going on around campus."/>
<meta name="twitter:image" content="https://philoi.app/og.png"/>

<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<style>
:root{
  --bg:#0E0A1C;--line:#2E2348;--ember:#ff7a2f;--ember2:#ffb05a;--gold:#ffd166;
  --ink:#f4f0ff;--muted:#c9bfe6;--dim:#8f85ad;
  --eg:linear-gradient(135deg,#ff7a2f,#ffb05a,#ffd166);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(900px 520px at 78% -8%,rgba(185,139,255,.16),transparent 60%),
    radial-gradient(700px 500px at 15% 108%,rgba(255,122,47,.12),transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;text-align:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));
}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.wrap{max-width:660px;width:100%;display:flex;flex-direction:column;align-items:center}
.flame{filter:drop-shadow(0 10px 28px rgba(255,122,47,.55))}
.mark{font-size:clamp(26px,6vw,38px);font-weight:900;letter-spacing:-.5px;margin-top:12px}
.kicker{font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  color:var(--ember2);margin-top:14px}
h1{font-size:clamp(22px,4.6vw,38px);font-weight:900;letter-spacing:-.4px;line-height:1.18;
  margin-top:12px;max-width:16ch}
h1 .glow{background:var(--eg);-webkit-background-clip:text;background-clip:text;color:transparent}
.form{display:flex;gap:9px;margin-top:26px;width:100%;max-width:400px}
.form input{flex:1;min-width:0;background:rgba(26,18,48,.8);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;color:var(--ink);font-size:16px;outline:none}
.form input::placeholder{color:var(--dim)}
.form input:focus{border-color:rgba(255,176,90,.5)}
.form button{font-weight:900;font-size:14px;color:#160d26;background:var(--eg);border:none;
  border-radius:13px;padding:13px 20px;cursor:pointer;box-shadow:0 12px 30px -12px rgba(255,150,70,.8);white-space:nowrap}
.form button:disabled{cursor:default;opacity:.85}
.note{font-size:11.5px;color:var(--dim);margin-top:12px;min-height:1.3em}
.note.err{color:var(--ember2)}
.foot{flex:none;font-size:11px;color:var(--dim);padding-top:10px}
.foot b{color:var(--muted)}
.foot a{color:var(--dim);text-decoration:none;margin:0 6px}
.foot a:hover,.foot a:focus-visible{color:var(--muted);text-decoration:underline}
.foot .legal{margin-top:6px}
/* short viewports (landscape phones, small laptops): tighten so nothing clips */
@media (max-height:620px){
  .flame{width:40px;height:46px}
  .mark{margin-top:6px;font-size:26px}
  .kicker{margin-top:8px}
  h1{margin-top:8px;font-size:clamp(18px,3.6vw,28px);max-width:24ch}
  .form{margin-top:14px}
  .note{margin-top:8px}
}
@media (max-height:420px){
  .flame,.kicker{display:none}
  .mark{margin-top:0;font-size:22px}
  h1{font-size:18px;max-width:34ch}
  .form{margin-top:10px}
  .form input,.form button{padding:10px 14px}
  .foot{padding-top:4px}
  .foot .legal{display:inline;margin:0 0 0 8px}
}
</style>
</head>
<body>
  <main>
  <div class="wrap">
    <svg class="flame" viewBox="0 0 40 46" width="54" height="62" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#ff7a2f"/>
      </linearGradient></defs>
      <path d="M20 3c0 5 1 10-1 13-2 2-3 2-5-2-1 6-6 8-6 15a12 12 0 0 0 24 0c0-12-9-15-12-26z" fill="url(#g)"/>
    </svg>
    <div class="mark">philoi</div>
    <div class="kicker">Your campus hub</div>
    <h1>The future home for students and clubs to <span class="glow">connect, chat,</span> and know what's going on around campus.</h1>
    <form class="form" id="waitlist" novalidate>
      <input type="email" name="email" placeholder="your@school.ca" aria-label="Email" autocomplete="email" maxlength="254" required/>
      <button type="submit">Notify me</button>
    </form>
    <div class="note" id="note" role="status" aria-live="polite">Launching soon. Be the first on your campus.</div>
  </div>
  </main>
  <footer class="foot">
    <div>φίλοι — Greek for <b>friends</b>.</div>
    <div class="legal"><a href="/terms.html">Terms</a><a href="/privacy.html">Privacy</a></div>
  </footer>
<script>
(function(){
  var URL='https://auth.philoi.app/rest/v1/rpc/join_waitlist';
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvYXFnY3F1enl3YWRyZ2h6YmZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1OTE0NDUsImV4cCI6MjA5ODE2NzQ0NX0.CuJD8tYsF8eYm96TVEFXke2Tlnse_d67mvBNeKGj_Qs';
  var form=document.getElementById('waitlist'),input=form.querySelector('input'),
      btn=form.querySelector('button'),note=document.getElementById('note'),
      intro=note.textContent;
  function say(text,err){note.textContent=text;note.className=err?'note err':'note'}
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var email=input.value.trim();
    if(!input.checkValidity()||!email){say('Enter a valid email.',true);input.focus();return}
    btn.disabled=true;btn.textContent='…';
    fetch(URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,
      'Authorization':'Bearer '+KEY},body:JSON.stringify({p_email:email})})
    .then(function(r){
      if(!r.ok)throw new Error(r.status);
      btn.textContent='Thanks ✓';input.value='';input.disabled=true;say(intro,false);
    })
    .catch(function(){
      btn.disabled=false;btn.textContent='Notify me';say('Something went wrong. Try again.',true);
    });
  });
})();
</script>
</body>
</html>
