<!DOCTYPE html>
<!-- Source for favicon.png (32x32) and apple-touch-icon.png (180x180).
     Size comes from the ?s= query param that _assets/build-assets.mjs appends. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Philoi icon</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{background:#3A2E5C;overflow:hidden}
  /* Pinned to the TOP-LEFT at an explicit pixel size rather than centred in the viewport.
     Headless Chrome does not always honour a small --window-size (it clamps to a minimum and
     then crops the screenshot out of the top-left of the real viewport), so a centred icon
     landed outside the crop and apple-touch-icon.png shipped as a blank plum square. Anchoring
     the art at 0,0 at exactly the requested size makes the crop correct whatever Chrome does
     with the window. */
  svg{position:fixed;top:0;left:0;width:var(--s,64px);height:var(--s,64px)}
</style>
<script>
  document.documentElement.style.setProperty(
    '--s', (new URLSearchParams(location.search).get('s') || 64) + 'px');
</script>
</head>
<body>
<svg viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#3A2E5C"/>
  <!-- The trailing translate/scale is THE flip: one flame orientation app-wide
       (CINDY_SPEC rendering rule 1). It mirrors about x=60 in the 120-wide local box,
       so the mark stays centred in the 64x64 tile. -->
  <g transform="translate(13.6 9) scale(0.3067) translate(120,0) scale(-1,1)">
    <rect x="30" y="112" width="60" height="9" rx="4" fill="#8A5A2B" transform="rotate(18 60 116)"/>
    <rect x="30" y="112" width="60" height="9" rx="4" fill="#6E4423" transform="rotate(-18 60 116)"/>
    <circle cx="60" cy="116" r="4" fill="#F2A33C"/>
    <path d="M60 20 C74 46 90 62 85 92 C82 108 72 116 60 116 C48 116 37 107 37 92 C37 82 42 76 47 72 C44 84 51 92 59 92 C68 92 72 82 67 72 C60 58 52 44 60 20 Z" fill="#E0612C"/>
    <path d="M60 44 C70 62 78 74 74 92 C72 104 67 110 60 110 C52 110 47 103 47 93 C47 86 50 82 54 80 C52 88 56 94 61 94 C67 94 70 87 67 80 C62 70 56 58 60 44 Z" fill="#F2A33C"/>
    <path d="M60 66 C66 78 70 84 68 94 C67 101 64 105 60 105 C55 105 52 100 52 94 C52 88 55 84 60 66 Z" fill="#FFD27A"/>
  </g>
</svg>
</body>
</html>
