<!DOCTYPE html>
<!-- Source for favicon.png (32x32) and apple-touch-icon.png (180x180).
     Size comes from the ?s= query param that _assets/build-assets.mjs appends. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Philoi icon</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{background:#3A2E5C;overflow:hidden}
  /* Pinned to the TOP-LEFT at an explicit pixel size rather than centred in the viewport.
     Headless Chrome does not always honour a small --window-size (it clamps to a minimum and
     then crops the screenshot out of the top-left of the real viewport), so a centred icon
     landed outside the crop and apple-touch-icon.png shipped as a blank plum square. Anchoring
     the art at 0,0 at exactly the requested size makes the crop correct whatever Chrome does
     with the window. */
  svg{position:fixed;top:0;left:0;width:var(--s,64px);height:var(--s,64px)}
</style>
<script>
  document.documentElement.style.setProperty(
    '--s', (new URLSearchParams(location.search).get('s') || 64) + 'px');
</script>
</head>
<body>
<svg viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E0612C"/><stop offset="0.55" stop-color="#F2A33C"/><stop offset="1" stop-color="#FFD27A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="#3A2E5C"/>
  <!-- FLAME_PATH from src/components/ui/flame-logo.tsx — the Cindy flame (CINDY_SPEC
       rendering rule 1). The trailing translate/scale is THE flip, applied once inside
       the 24-wide local box; the leading transform centres the glyph's bbox in the tile.
       Keep this identical to favicon.svg — they are the same icon at two resolutions. -->
  <g transform="translate(3.2 7.4) scale(2.4) translate(24,0) scale(-1,1)">
    <path d="M12 2c1.5 4.5 6 5.5 6 10.5a6 6 0 0 1-12 0c0-2.5 1-4 2.4-5.2 0 2.4 1.2 3.6 2.4 3.6.8-2.6-1.4-5 1.2-8.9z" fill="url(#g)"/>
  </g>
</svg>
</body>
</html>
