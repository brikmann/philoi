<!DOCTYPE html>
<!-- Source for og.png (1200x630). Regenerate with `node site/_assets/build-assets.mjs` — see README.md.
     Copy and palette follow the connection-first landing (design-mocks/322). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>philoi OG</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    position:relative;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    color:#f4f0ff;
    background:
      radial-gradient(620px 460px at 84% 46%,rgba(255,122,47,.30),transparent 64%),
      radial-gradient(560px 420px at 80% 36%,rgba(185,139,255,.32),transparent 62%),
      radial-gradient(700px 420px at 4% 0%,rgba(255,122,47,.12),transparent 60%),
      #0E0A1C;
    padding:72px 88px;
  }
  /* the faint fading grid from the hero */
  .grid{position:absolute;inset:0;opacity:.6;
    background-image:linear-gradient(rgba(185,139,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(185,139,255,.06) 1px,transparent 1px);
    background-size:44px 44px;-webkit-mask-image:radial-gradient(70% 80% at 72% 45%,#000,transparent 75%)}
  .col{position:relative}
  .logo{display:flex;align-items:baseline;gap:16px}
  .mark{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:-2px;line-height:1;font-size:52px}
  .mark .pp{font-weight:900;font-size:1.12em}
  .pron{font-size:20px;color:#8a80a8}
  h1{font-size:92px;font-weight:900;letter-spacing:-3.5px;line-height:.98;margin-top:44px}
  .em{background:linear-gradient(135deg,#ff7a2f,#ffb05a,#ffd166);-webkit-background-clip:text;color:transparent}
  .pill{display:inline-flex;align-items:center;gap:12px;margin-top:40px;font-size:22px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    color:#39d98a;background:rgba(57,217,138,.1);border:1.5px solid #1f5a40;border-radius:999px;padding:11px 24px}
  .pill .dot{width:12px;height:12px;border-radius:50%;background:#39d98a;box-shadow:0 0 12px #39d98a}
  .thesis{position:absolute;right:88px;bottom:76px;width:330px;text-align:right;font-size:24px;font-weight:700;line-height:1.3;color:#c9bfe6}
  .thesis b{color:#f4f0ff}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="col">
    <div class="logo"><span class="mark"><span class="pp">p</span>hiloi</span><span class="pron">FEE-loy · "friends"</span></div>
    <h1>Find your people.<br><span class="em">Lock in.</span><br>Climb your campus.</h1>
    <div class="pill"><span class="dot"></span>Live on iOS · Android next</div>
  </div>
  <div class="thesis">Social media runs on comparison. <b>philoi runs on connection.</b></div>
</body>
</html>
