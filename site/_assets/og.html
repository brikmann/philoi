<!DOCTYPE html>
<!-- Source for og.png (1200x630). Regenerate with `npm run assets` — see README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Philoi OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    position:relative;
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#FFF6EC;
    background:
      radial-gradient(900px 520px at 22% 10%,rgba(224,97,44,.32),transparent 62%),
      radial-gradient(700px 460px at 88% 90%,rgba(242,163,60,.16),transparent 62%),
      radial-gradient(600px 400px at 76% 6%,rgba(58,46,92,.6),transparent 64%),
      linear-gradient(150deg,#14111C,#1B1726 60%,#191428);
    display:flex;align-items:center;gap:72px;padding:0 92px;
  }
  /* the lava pooling on the bottom edge — the `emberfall` flare */
  .lava{
    position:absolute;left:-8%;right:-8%;bottom:-120px;height:300px;
    background:
      radial-gradient(56% 100% at 50% 100%,rgba(245,64,28,.55),rgba(224,97,44,.2) 44%,transparent 72%),
      radial-gradient(92% 100% at 50% 100%,rgba(242,163,60,.15),transparent 64%);
    filter:blur(2px);
  }
  .mark{position:relative;filter:drop-shadow(0 24px 70px rgba(224,97,44,.65));flex:none}
  .col{position:relative}
  .season{
    display:inline-flex;align-items:center;gap:12px;
    padding:8px 9px 8px 20px;border-radius:999px;
    border:1px solid rgba(255,210,122,.3);background:rgba(58,42,34,.5);
    font-size:19px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#FFD27A;
    margin-bottom:34px;
  }
  .season .tag{
    padding:5px 15px;border-radius:999px;letter-spacing:.14em;font-weight:800;
    background:linear-gradient(135deg,#E0612C,#F2A33C,#FFD27A);color:#3A1608;
  }
  h1{font-size:80px;font-weight:900;letter-spacing:-.045em;line-height:.98}
  .grad{background:linear-gradient(120deg,#E0612C,#F2A33C 46%,#FFD27A);-webkit-background-clip:text;color:transparent}
  .word{font-size:34px;font-weight:800;letter-spacing:-.02em;color:#FFF6EC}
  .slogan{
    font-size:17px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;
    color:#A99CBD;margin-top:8px;
  }
  .rule{width:110px;height:4px;border-radius:4px;background:linear-gradient(90deg,#E0612C,#F2A33C);margin:34px 0 26px}
  .soon{font-size:23px;font-weight:600;color:#A99CBD}
</style>
</head>
<body>
  <div class="lava"></div>
  <div class="mark">
    <svg width="250" height="250" viewBox="0 0 24 24">
      <defs>
        <linearGradient id="o" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#E0612C"/><stop offset="0.55" stop-color="#F2A33C"/><stop offset="1" stop-color="#FFD27A"/>
        </linearGradient>
      </defs>
      <!-- FLAME_PATH from src/components/ui/flame-logo.tsx — the Cindy flame. The
           translate/scale is THE flip (CINDY_SPEC rendering rule 1), applied once. -->
      <g transform="translate(24,0) scale(-1,1)">
        <path d="M12 2c1.5 4.5 6 5.5 6 10.5a6 6 0 0 1-12 0c0-2.5 1-4 2.4-5.2 0 2.4 1.2 3.6 2.4 3.6.8-2.6-1.4-5 1.2-8.9z" fill="url(#o)"/>
      </g>
    </svg>
  </div>
  <div class="col">
    <div class="season">Season 1<span class="tag">Emberfall</span></div>
    <div class="word">Philoi</div>
    <div class="slogan">For the Best on Campus</div>
    <div class="rule"></div>
    <h1>Turn Your Campus<br>Into Your <span class="grad">Leaderboard.</span></h1>
    <div class="soon" style="margin-top:26px">Coming to iOS soon — Android next.</div>
  </div>
</body>
</html>
