<!DOCTYPE html>
<!-- Source for og.png (1200x630). Regenerate with `npm run assets` — see README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Philoi OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#FFF6EC;
    background:
      radial-gradient(900px 520px at 22% 12%,rgba(224,97,44,.30),transparent 62%),
      radial-gradient(700px 460px at 88% 88%,rgba(242,163,60,.16),transparent 62%),
      radial-gradient(600px 400px at 76% 8%,rgba(58,46,92,.6),transparent 64%),
      linear-gradient(150deg,#14111C,#1B1726 60%,#191428);
    display:flex;align-items:center;gap:76px;padding:0 96px;
  }
  .mark{filter:drop-shadow(0 24px 70px rgba(224,97,44,.65));flex:none}
  h1{font-size:92px;font-weight:700;letter-spacing:-.035em;line-height:1.02}
  .grad{background:linear-gradient(100deg,#E0612C,#F2A33C 48%,#FFD27A);-webkit-background-clip:text;color:transparent}
  .word{
    font-size:24px;font-weight:600;letter-spacing:.36em;text-transform:uppercase;
    color:#FFD27A;margin-bottom:26px;
  }
  p{font-size:30px;line-height:1.45;color:#A99CBD;margin-top:30px;max-width:22ch}
  .rule{width:120px;height:4px;border-radius:4px;background:linear-gradient(90deg,#E0612C,#F2A33C);margin-top:36px}
</style>
</head>
<body>
  <div class="mark">
    <svg width="260" height="325" viewBox="0 0 120 150">
      <defs>
        <linearGradient id="o" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F2A33C"/><stop offset="55%" stop-color="#E0612C"/><stop offset="100%" stop-color="#C24A1E"/>
        </linearGradient>
        <linearGradient id="m" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFD27A"/><stop offset="100%" stop-color="#F2A33C"/>
        </linearGradient>
      </defs>
      <!-- Flipped horizontally: the one flame orientation, app-wide (CINDY_SPEC rendering
           rule 1). Mirrored inside the 120-wide local box, so the mark stays centred and no
           outer CSS transform (the roar/breathe keyframes) can multiply into it. -->
      <g transform="translate(120,0) scale(-1,1)">
      <rect x="30" y="112" width="60" height="9" rx="4" fill="#8A5A2B" transform="rotate(18 60 116)"/>
      <rect x="30" y="112" width="60" height="9" rx="4" fill="#6E4423" transform="rotate(-18 60 116)"/>
      <circle cx="60" cy="116" r="4" fill="#F2A33C"/>
      <path d="M60 20 C74 46 90 62 85 92 C82 108 72 116 60 116 C48 116 37 107 37 92 C37 82 42 76 47 72 C44 84 51 92 59 92 C68 92 72 82 67 72 C60 58 52 44 60 20 Z" fill="url(#o)"/>
      <path d="M60 44 C70 62 78 74 74 92 C72 104 67 110 60 110 C52 110 47 103 47 93 C47 86 50 82 54 80 C52 88 56 94 61 94 C67 94 70 87 67 80 C62 70 56 58 60 44 Z" fill="url(#m)"/>
      <path d="M60 66 C66 78 70 84 68 94 C67 101 64 105 60 105 C55 105 52 100 52 94 C52 88 55 84 60 66 Z" fill="#FFD27A"/>
      </g>
    </svg>
  </div>
  <div>
    <div class="word">Philoi</div>
    <h1>Lock in.<br><span class="grad">Together.</span></h1>
    <p>Social accountability for students.</p>
    <div class="rule"></div>
  </div>
</body>
</html>
