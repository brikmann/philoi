apply plugin: 'com.android.library'

group = 'expo.modules.philoiliveactivity'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
// Inherits compileSdk/targetSdk from the app rather than pinning them here — app.config.ts is
// already opinionated about those (compileSdk 36 for the AndroidX bump, targetSdk 35) and a second
// source of truth in a library module is how you get an AAR-metadata mismatch at build time.
useDefaultAndroidSdkVersions()
useExpoPublishing()

android {
  namespace "expo.modules.philoiliveactivity"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // 1.17+ is what backports the Android 16 (API 36) Live Updates surface —
  // NotificationCompat.Builder#setRequestPromotedOngoing. On older androidx.core that method
  // doesn't exist and this module won't compile, which is the failure mode we want (loud, at build
  // time) rather than a silently unpromoted notification.
  implementation "androidx.core:core-ktx:1.17.0"
}
